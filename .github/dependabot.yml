version: 2
updates:
- package-ecosystem: github-actions
  directories:
  - /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  rebase-strategy: disabled
- package-ecosystem: gomod
  directories:
  - /
  allow:
  - dependency-type: direct
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  rebase-strategy: disabled
